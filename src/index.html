<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-179018437-2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'UA-179018437-2');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complement</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <header>
        <div id="scoreCurr"></div>
        <div id="scoreHigh"></div>
    </header>
    <main>
        <svg viewBox="-500 -500 1000 1000" id="field">
            <defs>
                <radialGradient id="warpGlow">
                    <stop stop-color="#9bcaff" stop-opacity="0.5"/>
                    <stop offset="0.25" stop-color="#4269c6" stop-opacity="0.35"/>
                    <stop offset="1" stop-color="#070e28" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="starFade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="140">
                    <stop offset="0.25" stop-color="black"/>
                    <stop offset="0.5" stop-color="#555"/>
                    <stop offset="1" stop-color="white"/>
                </radialGradient>
                <mask id="starFadeMask" maskUnits="userSpaceOnUse"
                    x="-1200" y="-1200" width="2400" height="2400">
                    <rect x="-1200" y="-1200" width="2400" height="2400" fill="url(#starFade)"/>
                </mask>
            </defs>
            <rect id="warpGlowLayer" x="-500" y="-500" width="1000" height="1000"
                fill="url(#warpGlow)" opacity="0" aria-hidden="true"/>
            <g id="stars" stroke="white" stroke-linecap="round" mask="url(#starFadeMask)" aria-hidden="true"/>
            <g id="targetWrapper">
                <g id="target"/>
            </g>
            <g id="pts"/>
            <g id="ship">
                <circle id="hullInnerOutline" r="354"/>
                <g id="cannon0" transform="translate(-330, 0) scale(2)"/>
                <g id="cannon1" transform="translate(0, -330) scale(2)"/>
                <g id="cannon2" transform="translate(330, 0) scale(2)"/>
                <g id="cannon3" transform="translate(0, 330) scale(2)"/>
                <g id="hull">
                    <path d="M0-400a400 400 0 0 1 0 800 400 400 0 0 1 0-800m0 30a370 370 0 0 0 0 740 370 370 0 0 0 0-740"/>
                    <path d="M395-10l500-30v80l-500-30" transform="rotate(45)"/>
                    <path d="M395-10l500-30v80l-500-30" transform="rotate(-45)"/>
                    <path d="M395-10l500-30v80l-500-30" transform="rotate(135)"/>
                    <path d="M395-10l500-30v80l-500-30" transform="rotate(-135)"/>
                </g>
            </g>
            <g id="newGameCard" text-anchor="middle">
                <rect x="-420" y="-250" width="840" height="500" fill="#333c"/>
                <rect rx="10" x="-125" y="100" width="40" height="40"/>
                <rect rx="10" x="-175" y="150" width="40" height="40"/>
                <rect rx="10" x="-125" y="150" width="40" height="40"/>
                <rect rx="10" x="-75" y="150" width="40" height="40"/>
                <g fill="#ccc">
                    <text y="126" x="-105">↑</text>
                    <text y="176" x="-105">↓</text>
                    <text y="178" x="-155">←</text>
                    <text y="178" x="-55">→</text>
                </g>
                <text x="-35" y="20" transform="scale(3)">🖥️</text>
                <text x="50" y="22" transform="scale(3)">📱</text>
                <text x="40" y="115" transform="rotate(-30) scale(2)">👆</text>
            </g>
        </svg>
    </main>
    <footer>
        <div id="lives">&nbsp;</div>
    </footer>
    <script type="module" src="./game.js"></script>
</body>
</html>
